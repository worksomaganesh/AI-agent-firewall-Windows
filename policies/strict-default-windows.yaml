schema_version: "1.0"
policy_id: "strict-windows-local-dev"
description: "Fail-closed example policy for Windows AI coding-agent sessions."
workspace_root: "/workspace"
default_decision: "deny"
filesystem:
  deny:
    - id: "deny-dotenv-secrets"
      operations: ["read", "write", "delete", "execute"]
      paths: ["**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.pfx", "**/*.p12"]
      reason: "Protect secret files and private keys inside the staged workspace."
    - id: "deny-git-hooks-persistence"
      operations: ["write", "delete", "execute"]
      paths: [".git/hooks/**", ".git/config"]
      reason: "Prevent persistence through Git hooks or repository configuration."
  require_approval:
    - id: "approve-ci-workflow-edits"
      operations: ["write", "delete"]
      paths: [".github/workflows/**", "pyproject.toml"]
      reason: "Changing CI workflows or dependency metadata requires human approval."
    - id: "approve-workspace-delete"
      operations: ["delete"]
      paths: ["/workspace/**"]
      reason: "Deleting staged workspace files requires human approval."
  allow:
    - id: "allow-workspace-read-write"
      operations: ["read", "write"]
      paths: ["/workspace/**"]
      reason: "Permit ordinary source-file access inside the private staged workspace."
commands:
  deny:
    - id: "deny-privilege-launchers"
      executables: ["runas.exe", "psexec.exe"]
      reason: "Privilege-switching and remote-execution launchers are denied by this sample policy."
    - id: "deny-force-git-push"
      executables: ["git.exe", "git"]
      arg_patterns: ["*push*--force*", "*push*-f*"]
      reason: "Force-pushing Git history is prohibited."
  require_approval:
    - id: "approve-git-push-reset"
      executables: ["git.exe", "git"]
      arg_patterns: ["push*", "reset*--hard*"]
      reason: "Pushing commits or hard-resetting requires human approval."
    - id: "approve-package-installs"
      executables: ["pip.exe", "pip", "uv.exe", "uv", "npm.cmd", "npm", "pnpm.cmd", "pnpm"]
      arg_patterns: ["install*", "add*"]
      reason: "Installing external packages requires human approval."
  allow:
    - id: "allow-safe-inspection"
      executables: ["git.exe", "git", "pytest.exe", "pytest", "ruff.exe", "ruff"]
      arg_patterns: ["status*", "diff*", "log*", "-v*", "--version*"]
      reason: "Permit selected read-only inspection and local test commands when mediated."
network:
  deny:
    - id: "deny-local-and-metadata"
      hosts: ["localhost", "*.localhost", "127.*", "169.254.169.254", "::1"]
      ports: [80, 443, 8080, 22, 5432, 6379]
      reason: "Block loopback and cloud metadata destinations."
  require_approval:
    - id: "approve-package-registries"
      hosts: ["pypi.org", "files.pythonhosted.org", "registry.npmjs.org"]
      ports: [443]
      reason: "Package registry access requires human approval."
  allow:
    - id: "allow-llm-apis"
      hosts: ["api.anthropic.com", "generativelanguage.googleapis.com"]
      ports: [443]
      reason: "Allow configured LLM inference API destinations."

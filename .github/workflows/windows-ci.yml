name: Windows Core and Package Checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Show Ruff import fix
        continue-on-error: true
        run: python -m ruff check --select I --fix --diff .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src/agent_boundary
      - name: Run portable core tests
        run: python -m pytest --cov=agent_boundary --cov-report=term-missing
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  mxc-probe-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and build MXC host probe
        run: dotnet build .\tools\MxcProbe\MxcProbe.csproj --configuration Release
